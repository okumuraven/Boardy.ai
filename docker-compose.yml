
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vokazi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vokazi_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    network_mode: "host"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # In-App Calling (Phase 1, call_feature.md) - self-hosted STUN/TURN, no
  # managed third party. `network_mode: host` (matching `backend` below)
  # so coturn's wide relay port range is exposed directly rather than
  # fighting Docker's bridge-network NAT, a common coturn-in-Docker
  # gotcha. `--min-port`/`--max-port` is narrowed for local dev; a real
  # deployment would want a wider range.
  coturn:
    image: coturn/coturn:latest
    network_mode: "host"
    env_file:
      - ./backend/.env
    command: >
      sh -c "turnserver -n --listening-port=3478 --min-port=49152 --max-port=49200
      --use-auth-secret --static-auth-secret=$$TURN_SECRET --realm=kuzanaconnect.local
      --no-tls --no-dtls --log-file=stdout"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
