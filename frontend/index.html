    <!-- interactive-widget=resizes-content: the browser actually shrinks the
         layout/visual viewport when the on-screen keyboard opens, instead of
         leaving the keyboard floating over unshrunk content. This is what
         lets a `position: fixed; inset: 0` chat screen (ChatSystem.jsx) push
         its compose bar up above the keyboard the way WhatsApp/Telegram do,
         without any JS visualViewport polyfill. Chrome 108+/Chromium-based
         browsers (Samsung Internet included); older browsers just ignore
         the unknown token and keep prior (imperfect but working) behavior. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
