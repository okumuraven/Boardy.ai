# Fly.io app config for the Vokazi/Kuzana Connect backend.
# Deploy with: flyctl deploy --config backend/fly.toml --dockerfile backend/Dockerfile.fly
app = "kuzana-connect-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PHX_SERVER = "true"
  PORT = "4000"
  PHX_HOST = "kuzana-connect-api.fly.dev"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.status]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    port = 4000
    timeout = "5s"
    type = "http"
